name: Conda package
# Builds the noarch conda package forcefields with the recipe in conda/.
# Pull requests that change the force fields or the recipe only build and
# test it. A tag v<version> (for example v2026.11.23) uploads it to the
# channel alexandriachemistry on anaconda.org with the label main, a run by
# hand with the label that is given, dev by default. All force field files
# must pass the checksum check first. The upload needs the repository secret
# ANACONDA_API_TOKEN.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "**.xml"
      - "conda/**"
      - ".github/workflows/conda.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the package to anaconda.org"
        type: boolean
        default: false
      label:
        description: "Label of the uploaded package"
        type: string
        default: "dev"
      version:
        description: "Version of the package (default: the date)"
        type: string
        default: ""

jobs:
  check:
    uses: ./.github/workflows/check-forcefields.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      # Inside the workspace, since upload-artifact refuses paths with ..
      CONDA_OUT: ${{ github.workspace }}/conda-out
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
              version="${INPUT_VERSION}"
          else
              version="$(date -u +%Y.%m.%d)"
          fi
          echo "Version ${version}"
          echo "FORCEFIELDS_VERSION=${version}" >> "$GITHUB_ENV"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install rattler-build and anaconda-client
        shell: bash -el {0}
        run: |
          conda install rattler-build anaconda-client
          rattler-build --version
      - name: Build and test
        shell: bash -el {0}
        run: |
          rattler-build build --recipe conda/recipe.yaml --channel conda-forge \
                              --output-dir ${CONDA_OUT}
          ls -l ${CONDA_OUT}/noarch/*.conda
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: conda-noarch
          path: ${{ env.CONDA_OUT }}/noarch/*.conda
      - name: Upload to anaconda.org
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload)
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'main' || inputs.label }}
        run: |
          anaconda upload --user alexandriachemistry --label ${LABEL} \
                   ${CONDA_OUT}/noarch/*.conda
